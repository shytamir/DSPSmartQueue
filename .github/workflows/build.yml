name: Thunderstore package scaffold

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.302'
      - name: Run offline checks
        shell: pwsh
        run: |
          dotnet run --project tests/FoundationChecks -c Release -- --logic-only
          if ($LASTEXITCODE) { throw 'Offline checks failed.' }
          'Offline logic and binding fixtures passed. No plugin compilation, real-reference checks, Harmony execution, or Unity rendering.' >> $env:GITHUB_STEP_SUMMARY

  package-scaffold:
    needs: offline-checks
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Prepare incomplete package scaffold
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ./scripts/Get-BuildVersion.ps1 -BuildNumber $env:BUILD_NUMBER
          $stage = Join-Path $PWD 'artifacts/package-scaffold'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $manifest = [ordered]@{
            name = 'DSPSmartQueue'
            version_number = $version
            website_url = 'https://github.com/shytamir/DSPSmartQueue'
            description = 'Package scaffold for the Replicator queue presentation adapter.'
            dependencies = @('xiaoye97-BepInEx-5.4.17')
          }
          $manifest | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $stage 'manifest.json') -Encoding utf8NoBOM
          Copy-Item -LiteralPath 'README.md', 'LICENSE' -Destination $stage
          @'
          INCOMPLETE SCAFFOLD - DO NOT INSTALL OR PUBLISH
          This artifact contains metadata and documentation only.
          See docs/PROJECT.md in the repository for delivery readiness.
          '@ | Set-Content (Join-Path $stage 'SCAFFOLD-NOT-INSTALLABLE.txt') -Encoding utf8NoBOM
          $zip = Join-Path $PWD "artifacts/DSPSmartQueue-scaffold-$version.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "Scaffold version: $version. No plugin was built; no release was published." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload incomplete scaffold
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: DSPSmartQueue-scaffold-${{ github.run_number }}
          path: artifacts/DSPSmartQueue-scaffold-*.zip
          if-no-files-found: error
          retention-days: 14
