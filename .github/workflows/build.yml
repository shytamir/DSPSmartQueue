name: Build release package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.302'
      - name: Build and validate public package
        id: package
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected source revision.' }
          ./scripts/New-Package.ps1 -Hosted -BuildNumber 1
          $packages = @(Get-ChildItem artifacts/package -Filter '*.zip')
          if ($packages.Count -ne 1) { throw 'Expected exactly one release ZIP.' }
          $package = $packages[0].FullName
          ./tests/PackageChecks.ps1 -Path $package
          $inspection = Get-Content "$package.inspection.json" -Raw | ConvertFrom-Json
          "path=$package" >> $env:GITHUB_OUTPUT
          "version=$($inspection.version)" >> $env:GITHUB_OUTPUT
          "### Validated public package $($inspection.version)" >> $env:GITHUB_STEP_SUMMARY
          "Source: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "ZIP SHA256: $($inspection.sha256)" >> $env:GITHUB_STEP_SUMMARY
          'Compilation uses public dependencies and compile-only game/UI shims. Offline logic, metadata, package contents, and rejection tests passed. No game execution or runtime compatibility claim.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload public package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: DSPSmartQueue-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload maintainer evidence separately
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: build-evidence
          path: |
            artifacts/package/*.build.json
            artifacts/package/*.inspection.json
          if-no-files-found: error
          retention-days: 30
