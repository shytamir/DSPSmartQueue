name: Offline checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.302'
      - name: Run offline checks
        shell: pwsh
        run: |
          $version = ./scripts/Get-BuildVersion.ps1 -BuildNumber $env:GITHUB_RUN_NUMBER
          dotnet run --project tests/FoundationChecks -c Release -- --logic-only
          if ($LASTEXITCODE) { throw 'Offline checks failed.' }
          'Offline logic and binding fixtures passed. No plugin compilation, real-reference checks, Harmony execution, or Unity rendering.' >> $env:GITHUB_STEP_SUMMARY
          "Version: $version. Private packages require the local real-reference build." >> $env:GITHUB_STEP_SUMMARY
